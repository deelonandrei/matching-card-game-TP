
<!DOCTYPE html>
<html>
<head>
    <title>MATCHING CARD GAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Screen Transition -->
    <div class="screen-transition" id="screenTransition"></div>

    <h1>IT'S A MATCH!</h1>
    <p>FIND ALL THE MATCHING PAIRS!</p>

    <!-- Menu button -->
    <div class="menu-container">
        
        <button class="start-button">START</button>

        <button class="how-to-play-button" id="howToPlayButton">
    HOW TO PLAY
</button>
    </div>

    <!-- How To Play Screen -->
<div class="how-to-play-screen" id="howToPlayScreen">

    <div class="instructions-content">

        <div class="instruction-list">
            <p>1. Click a card to reveal its picture.</p>
            <p>2. Find two cards with matching pictures.</p>
            <p>3. Remember the pictures you've seen!</p>
            <p>4. Match all 6 pairs to win!</p>
        </div>

        <h3>GOOD LUCK, LITTLE WIZARD!</h3>

        <button class="back-button" id="backButton">
            BACK
        </button>

    </div>

</div>

    <!-- Game Cards --> 
    <div class="game-container">
        <div class="card-grid">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
    </div>

   
<!-- Settings button -->
<div class="settings-container">

    <button class="settings-button" id="settingsToggle">
        🔊
    </button>

    <!-- Background Music -->
<audio id="backgroundMusic" loop>
    <source src="music/A Lonely Cherry Tree 🌸.mp3" type="audio/mpeg">
</audio>

    <!-- Settings Menu -->
    <div class="settings-menu" id="settingsMenu">
        <div class="settings-header">
            <span class="settings-title">SETTINGS</span>

            <div class="window-buttons">
                <button class="close-button" id="settingsClose">×</button>
            </div>
        </div>

        <!-- Settings Content -->
        <div class="settings-content">

            <h3 class="sound-label">SOUNDS</h3>

            <div class="volume-control">

                <button class="volume-minus">−</button>

                <input
                    type="range"
                    class="volume-slider"
                    min="0"
                    max="100"
                    value="50"
                >

                <button class="volume-plus">+</button>

            </div>

            <div class="volume-value">50%</div>

        </div>

    </div>
</div>

    <script src="script.js"></script>

</body>
</html>
