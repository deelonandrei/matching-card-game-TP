
<!DOCTYPE html>
<html>
<head>
    <title>MATCHING CARD GAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>IT'S A MATCH!</h1>
    <p>FIND ALL THE MATCHING PAIRS!</p>

    <!-- Start button -->
    <div class="menu-container">
        <button class="start-button">START</button>
    </div>

    <!-- Game Cards -->
    <div class="game-container">
        <div class="card-grid">
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>

            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>

            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
        </div>
    </div>

    <!-- Settings button -->
    <div class="settings-container">
        <button class="settings-button">⚙</button>

        <!-- Settings Menu -->
        <div class="settings-menu">

            <div class="settings-header">

                <!-- Window buttons -->
                <div class="window-buttons">
                    <button class="minimize-button">−</button>
                    <button class="maximize-button">□</button>
                    <button class="close-button">×</button>
                </div>
                
            </div>

            
<!-- Settings options -->
<div class="settings-content">

    <h3 class="sound-label">SOUNDS</h3>

    <div class="volume-control">

        <button class="volume-minus">−</button>

        <input
            type="range"
            class="volume-slider"
            min="0"
            max="100"
            value="50"
        >

        <button class="volume-plus">+</button>

    </div>

</div>

    <script src="script.js"></script>
</body>
</html>
